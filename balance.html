<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プリペイド残高確認</title>
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif; background: #f7f5f2; margin: 0; padding: 12px; color: #222; }
.container { max-width: 520px; margin: 0 auto; }
.card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.07); margin-bottom: 12px; }
h1 { font-size: 22px; margin: 0 0 6px; }
.sub { color: #777; font-size: 14px; margin-bottom: 16px; line-height: 1.6; }
label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
input { width: 100%; padding: 13px; font-size: 18px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 14px; }
button { width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 18px; font-weight: 700; background: #d8ecf8; cursor: pointer; color: #222; font-family: inherit; }
button:disabled { opacity: .5; cursor: default; }
.message { margin-top: 14px; text-align: center; font-weight: 700; color: #b91c1c; }
.hide { display: none !important; }
.loading { text-align: center; padding: 40px 0; color: #888; font-weight: 700; }

.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.name { font-size: 18px; font-weight: 800; }
.link { background: none; width: auto; padding: 4px 0; font-size: 13px; color: #2c5d8a; font-weight: 700; text-decoration: underline; }
.shared { margin-top: 4px; font-size: 12px; color: #4b3a78; font-weight: 700; }
.balance-label { color: #777; font-size: 13px; margin-top: 10px; }
.balance { font-size: 40px; font-weight: 800; line-height: 1.2; }
.history-title { font-size: 15px; font-weight: 800; margin: 16px 0 4px; }
.history-item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
.history-date { color: #888; font-size: 12px; }
.history-content { font-weight: 700; font-size: 15px; }
.amt { font-weight: 800; white-space: nowrap; align-self: center; }
.amt.minus { color: #b42318; } .amt.plus { color: #1b6e3c; }
.line-note { margin-top: 12px; font-size: 12px; color: #1b6e3c; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div id="loading" class="card loading">読み込み中…</div>

  <!-- ログイン（PIN） -->
  <div id="loginCard" class="card hide">
    <h1>プリペイド残高確認</h1>
    <div class="sub" id="loginSub">診察券番号と4桁PINを入力してください</div>
    <label for="patientId">診察券番号</label>
    <input type="text" inputmode="numeric" id="patientId" placeholder="診察券番号を入力" autocomplete="off">
    <label for="pin">4桁PIN</label>
    <input type="password" inputmode="numeric" id="pin" maxlength="4" placeholder="4桁の数字" autocomplete="current-password">
    <button id="btn" type="button">残高を確認する</button>
    <div id="message" class="message"></div>
  </div>

  <!-- 残高 -->
  <div id="result" class="card hide">
    <div class="head">
      <div class="name" id="patientName"></div>
      <button class="link" id="btnSwitch" type="button">別の番号で確認</button>
    </div>
    <div id="shared" class="shared hide">ご家族で共有している残高です</div>
    <div class="balance-label">現在残高</div>
    <div class="balance">¥<span id="balance">0</span></div>
    <div class="history-title">最近の利用履歴</div>
    <div id="history"></div>
    <div id="lineNote" class="line-note hide">LINEと連携済み：次回もLINEで開くだけで確認できます</div>
  </div>
</div>

<script>
// ===== 設定（GitHub Pages などGASの外に置く時だけ入れる） =====
var GAS_URL = "https://script.google.com/macros/s/AKfycbySBmuA9Q0c7DBAWC9F-M-2SAXlRBDvIaLG_qGf8nozxtk-YIwfixVUDf1sLPb5fDjHcw/exec";   // 例：https://script.google.com/macros/s/xxxxxxxx/exec
var LIFF_ID = "2011651323-fh1dWinC";   // 例：2001234567-AbCdEfGh（LINE Developers の LIFF ID）

// ===== ここから下は変更不要 =====
var IN_GAS = !!(window.google && google.script && google.script.run);
var USE_LINE = !IN_GAS && !!LIFF_ID && !!GAS_URL;
var idToken = "";
var $ = function(id) { return document.getElementById(id); };
function half(v) { return String(v || "").replace(/[０-９]/g, function(c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[^\d]/g, ""); }
function show(id) { $(id).classList.remove("hide"); }
function hide(id) { $(id).classList.add("hide"); }

function call(req, ok, ng) {
  if (IN_GAS) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e) { ng(e && e.message ? e.message : String(e)); }).api(req);
  } else {
    fetch(GAS_URL, { method: "POST", body: JSON.stringify(req) })
      .then(function(r) { return r.json(); })
      .then(ok)
      .catch(function(e) { ng(e && e.message ? e.message : String(e)); });
  }
}

function showLogin(msg) {
  hide("loading"); hide("result"); show("loginCard");
  $("pin").value = "";
  $("message").textContent = msg || "";
  $("loginSub").innerHTML = USE_LINE
    ? "はじめての方は、診察券番号と4桁PINを入力してください。<br>次回からはLINEで開くだけで残高が見られます。"
    : "診察券番号と4桁PINを入力してください";
}

function showResult(data) {
  hide("loading"); hide("loginCard"); show("result");
  $("patientName").textContent = data.name + " 様";
  $("shared").classList.toggle("hide", !data.shared);
  $("balance").textContent = Number(data.balance).toLocaleString();
  $("lineNote").classList.toggle("hide", !(USE_LINE && data.linked));
  $("btnSwitch").textContent = USE_LINE ? "別の番号に切り替え" : "別の番号で確認";

  var history = $("history");
  history.innerHTML = "";
  if (!data.history || !data.history.length) {
    var none = document.createElement("div");
    none.className = "history-item"; none.textContent = "履歴はありません";
    history.appendChild(none);
    return;
  }
  data.history.forEach(function(item) {
    var div = document.createElement("div"); div.className = "history-item";
    var left = document.createElement("div");
    var d = document.createElement("div"); d.className = "history-date"; d.textContent = item.date;
    var c = document.createElement("div"); c.className = "history-content"; c.textContent = item.content;
    left.appendChild(d); left.appendChild(c);
    var a = document.createElement("div"); a.className = "amt " + (item.minus ? "minus" : "plus"); a.textContent = item.amount || "";
    div.appendChild(left); div.appendChild(a);
    history.appendChild(div);
  });
}

function login() {
  var btn = $("btn");
  var patientId = half($("patientId").value);
  var pin = half($("pin").value);
  var message = $("message");
  message.textContent = "";

  if (!patientId) { message.textContent = "診察券番号を入力してください"; return; }
  if (!/^\d{4}$/.test(pin)) { message.textContent = "PINは4桁の数字で入力してください"; return; }

  btn.disabled = true;
  var req = USE_LINE
    ? { action: "lineLink", idToken: idToken, patientId: patientId, pin: pin }
    : { action: "balance", patientId: patientId, pin: pin };
  call(req,
    function(data) {
      btn.disabled = false;
      if (data.relogin) { relogin(); return; }
      if (!data.success) { message.textContent = data.message; return; }
      showResult(data);
    },
    function(msg) { btn.disabled = false; message.textContent = "確認できませんでした：" + msg; });
}
$("btn").addEventListener("click", login);
$("pin").addEventListener("keydown", function(e) { if (e.key === "Enter") login(); });

$("btnSwitch").addEventListener("click", function() {
  if (!USE_LINE) { showLogin(); return; }
  if (!confirm("このLINEと診察券番号の連携を解除して、別の番号でログインしますか？")) return;
  call({ action: "lineUnlink", idToken: idToken },
    function(r) { if (r.relogin) { relogin(); return; } showLogin(r.message); },
    function(msg) { alert("解除できませんでした：" + msg); });
});

// ===== LINEログイン =====
function relogin() {
  var n = 0;
  try { n = Number(sessionStorage.getItem("liffRelogin") || 0); sessionStorage.setItem("liffRelogin", String(n + 1)); } catch (e) {}
  if (n >= 2) { showLogin("LINEの確認ができませんでした。時間をおいて開き直してください"); return; }
  try { liff.logout(); } catch (e) {}
  liff.login({ redirectUri: location.href });
}

function startLine() {
  var s = document.createElement("script");
  s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
  s.charset = "utf-8";
  s.onload = function() {
    liff.init({ liffId: LIFF_ID }).then(function() {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken() || "";
      if (!idToken) { relogin(); return; }
      call({ action: "line", idToken: idToken },
        function(r) {
          if (r.relogin) { relogin(); return; }
          try { sessionStorage.removeItem("liffRelogin"); } catch (e) {}
          if (r.needLink) { showLogin(); return; }
          if (!r.success) { showLogin(r.message); return; }
          showResult(r);
        },
        function(msg) { showLogin("読み込めませんでした：" + msg); });
    }).catch(function(e) { showLogin("LINEの読み込みに失敗しました：" + e.message); });
  };
  s.onerror = function() { showLogin("LINEの読み込みに失敗しました"); };
  document.head.appendChild(s);
}

if (USE_LINE) startLine();
else if (!IN_GAS && !GAS_URL) { hide("loading"); showLogin("balance.html の GAS_URL がまだ入っていません"); }
else showLogin();
</script>
</body>
</html>
